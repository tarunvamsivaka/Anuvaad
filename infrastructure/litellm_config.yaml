################################################################################
# Anuvaad LiteLLM Gateway Configuration
# Sprint 6: Oracle Always Free Infrastructure
# ─────────────────────────────────────────────────────────────────────────────
# Deploy: docker run -p 4000:4000 -v $(pwd)/litellm_config.yaml:/app/config.yaml \
#           -e CEREBRAS_API_KEY=$CEREBRAS_API_KEY \
#           -e GEMINI_API_KEY=$GEMINI_API_KEY \
#           -e DEEPSEEK_API_KEY=$DEEPSEEK_API_KEY \
#           -e GROQ_API_KEY=$GROQ_API_KEY \
#           -e OPENROUTER_API_KEY=$OPENROUTER_API_KEY \
#           ghcr.io/berriai/litellm:main-latest \
#           --config /app/config.yaml
#
# Backend AI service (app/services/ai.py) connects to:
#   LITELLM_PROXY_URL=http://localhost:4000 (or http://litellm:4000 in Docker)
#
# Pricing: $0.00/month — all Tier 1-4 APIs have free tiers; Tier 5 is local.
################################################################################

model_list:

  # ── Tier 1: Cerebras Cloud LPU ──────────────────────────────────────────────
  # 2,100 tok/s inference via LPU chips (fastest LLM API available)
  # Free tier: ~1M tokens/day, no credit card required
  # Signup: https://cloud.cerebras.ai
  - model_name: tier1-cerebras
    litellm_params:
      model: cerebras/llama-3.3-70b
      api_key: os.environ/CEREBRAS_API_KEY
      max_tokens: 8192
      temperature: 0.1

  # ── Tier 2: Google Gemini 2.0 Flash ─────────────────────────────────────────
  # Free: 15 RPM / 1M TPM / 1,500 RPD (as of 2026)
  # Best for: multi-modal tasks, large context (1M tokens)
  # Signup: https://aistudio.google.com/app/apikey
  - model_name: tier2-gemini
    litellm_params:
      model: gemini/gemini-2.0-flash
      api_key: os.environ/GEMINI_API_KEY
      max_tokens: 8192
      temperature: 0.1

  # ── Tier 3: DeepSeek V3 ─────────────────────────────────────────────────────
  # Free: generous credits on signup; 60 RPM rate limit
  # Best for: code generation (SWE-bench leader), math reasoning
  # Signup: https://platform.deepseek.com
  - model_name: tier3-deepseek
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: os.environ/DEEPSEEK_API_KEY
      max_tokens: 8192
      temperature: 0.1

  # ── Tier 4: Groq Cloud ──────────────────────────────────────────────────────
  # Free: 14,400 RPD / 30 RPM for Llama 3.3 70B
  # Best for: low-latency inference (sub-200ms for short prompts)
  # Signup: https://console.groq.com
  - model_name: tier4-groq
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY
      max_tokens: 8192
      temperature: 0.1

  # ── Tier 4b: OpenRouter Free ────────────────────────────────────────────────
  # Free: 100+ models with free tier (varies by model)
  # Best for: fallback when other tiers hit rate limits
  # Signup: https://openrouter.ai
  - model_name: tier4b-openrouter
    litellm_params:
      model: openrouter/meta-llama/llama-3.1-70b-instruct:free
      api_key: os.environ/OPENROUTER_API_KEY
      max_tokens: 8192
      temperature: 0.1

  # ── Tier 5: Ollama (Local Oracle VM) ────────────────────────────────────────
  # Free: unlimited local inference on Oracle Always Free A1.Flex (4 OCPUs, 24GB)
  # Models: llama3.3 (8B fits in 24GB RAM), deepseek-coder:6.7b
  # Deploy: curl -fsSL https://ollama.ai/install.sh | sh && ollama pull llama3.3
  - model_name: tier5-ollama-llama
    litellm_params:
      model: ollama/llama3.3
      api_base: http://ollama:11434
      max_tokens: 4096
      temperature: 0.1

  - model_name: tier5-ollama-coder
    litellm_params:
      model: ollama/deepseek-coder:6.7b
      api_base: http://ollama:11434
      max_tokens: 4096
      temperature: 0.05

# ── Router Configuration ─────────────────────────────────────────────────────
# Automatic failover: tries tier1 → tier2 → ... → tier5 on error or rate limit
router_settings:
  routing_strategy: latency-based-routing    # Use fastest healthy model
  num_retries: 2
  timeout: 30
  retry_after: 5
  allowed_fails: 2                            # Fail 2× before marking model unhealthy
  cooldown_time: 60                           # Seconds to wait before retrying unhealthy model

  # Model groups for routing (Anuvaad backend uses these aliases)
  model_group_alias:
    default:
      - tier1-cerebras
      - tier2-gemini
      - tier3-deepseek
      - tier4-groq
      - tier4b-openrouter
      - tier5-ollama-llama
    code-only:
      - tier3-deepseek
      - tier5-ollama-coder
      - tier4-groq

# ── General Settings ─────────────────────────────────────────────────────────
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY    # Generate: openssl rand -hex 32
  database_url: os.environ/LITELLM_DATABASE_URL # Optional: Postgres for request logging

# ── Logging & Observability ──────────────────────────────────────────────────
litellm_settings:
  # OpenTelemetry tracing → Grafana Cloud (Sprint 8)
  # success_callback: ["otel"]
  # failure_callback: ["otel"]
  # OTEL_EXPORTER_OTLP_ENDPOINT: https://otlp-gateway-prod-us-east-0.grafana.net/otlp

  # ZDR Compliance: Do NOT log request bodies (source code is confidential)
  set_verbose: false
  drop_params: true      # Drop unsupported params rather than erroring
  request_timeout: 30

  # Log costs and token counts only (not prompts/completions)
  callbacks:
    - custom_callback_path: "app.core.litellm_zdr_logger"  # Custom ZDR-safe logger
