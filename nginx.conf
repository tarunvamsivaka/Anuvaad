# ── REAL IP (FOR PROXIES/LOAD BALANCERS) ──
# P0-INF-01: Restrict real IP trust to private RFC1918 subnets and loopback
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# ── RATE LIMITING ──
limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=10r/s;
# P3-INF-02: Return RFC 6585 compliant HTTP 429 Too Many Requests on rate limit exhaustion
limit_req_status 429;

# ── REQUEST LIMITS ──
# P3-INF-03: Allow up to 25MB request payloads (code translation archives, large AST payloads)
client_max_body_size 25m;

upstream nextjs {
    server frontend:3000;
    keepalive 32;  # Persistent connection pool to Next.js
}

upstream fastapi {
    server backend:8000;
    keepalive 32;  # Persistent connection pool to FastAPI
}

# ── GZIP COMPRESSION ──
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml
    application/font-woff2;

# ── SHARED SECURITY HEADERS MAP ──
# Applied in each server block rather than top-level to allow block-level overrides.

# ── HTTP SERVER — redirects all traffic to HTTPS (INFRA-01) ──
server {
    listen 80;
    server_name ${DOMAIN};

    # Allow Let's Encrypt ACME challenge through
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}


# ── HTTPS SERVER (INFRA-01: HSTS + TLS 1.2/1.3) ──
server {
    listen 443 ssl http2;
    server_name ${DOMAIN};

    # TLS certificates (managed by Certbot / Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            1.1.1.1 8.8.8.8 valid=300s;

    # ── SECURITY HEADERS ──
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    # SEC-XSS-01: Use 0 (disable legacy XSS auditor) — consistent with FastAPI backend.
    # The legacy auditor (1; mode=block) can itself be exploited via XSS injection.
    # XSS protection is now provided by CSP instead.
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # SEC-CSP-01: Removed 'unsafe-inline' and 'unsafe-eval' from script-src.
    # These directives nullified CSP's XSS protection entirely.
    # 'unsafe-inline' for style-src is retained as Next.js requires it for
    # styled-jsx/CSS-in-JS. A nonce-based CSP in Next.js middleware is the
    # recommended long-term replacement for inline styles as well.
    # NOTE: After implementing nonce-based CSP in Next.js, set a stricter
    # script-src using 'nonce-{NONCE}' instead of 'self'.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.razorpay.com; img-src 'self' data: blob:; font-src 'self'; frame-src https://api.razorpay.com https://checkout.razorpay.com;" always;

    # ── PROXY BUFFER TUNING (improves SSE streaming) ──
    proxy_buffer_size          8k;
    proxy_buffers              8 16k;
    proxy_busy_buffers_size    32k;

    # Proxy API requests to FastAPI backend
    location /api/ {
        limit_req zone=api_rate_limit burst=20 nodelay;
        proxy_pass http://fastapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";  # Enable keepalive to upstream
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # Proxy all other requests to Next.js frontend
    location / {
        proxy_pass http://nextjs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Next.js static assets — long cache
    location /_next/static/ {
        proxy_pass http://nextjs;
        expires 365d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        # SEC-CSP-01: Removed 'unsafe-inline' and 'unsafe-eval' from script-src (consistent with main block).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.razorpay.com; img-src 'self' data: blob:; font-src 'self'; frame-src https://api.razorpay.com https://checkout.razorpay.com;" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Next.js image optimization — moderate cache
    location /_next/image {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        # SEC-CSP-01: Removed 'unsafe-inline' and 'unsafe-eval' from script-src (consistent with main block).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.razorpay.com; img-src 'self' data: blob:; font-src 'self'; frame-src https://api.razorpay.com https://checkout.razorpay.com;" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
