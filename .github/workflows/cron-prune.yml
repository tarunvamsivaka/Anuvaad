name: Database Footprint Prune Cron

# Runs daily at 03:00 UTC to prune anonymous translation history (>7d)
# and stale vector embeddings (>30d), keeping Supabase free-tier database
# footprint strictly within the 500 MB quota without requiring a dedicated Celery worker.
#
# Configured secrets required in GitHub Repository Settings:
#   - RENDER_API_URL (e.g. https://api.getanuvaad.com)
#   - CRON_SECRET (Pre-shared bearer token matching CRON_SECRET on Render)

on:
  schedule:
    - cron: '0 3 * * *'  # Daily at 03:00 UTC
  workflow_dispatch:     # Allow manual trigger from GitHub Actions tab

permissions:
  contents: read

jobs:
  prune:
    name: Trigger Database Prune
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger Prune Endpoint
        run: |
          API_URL="${{ secrets.RENDER_API_URL }}"
          CRON_SECRET="${{ secrets.CRON_SECRET }}"

          if [ -z "$API_URL" ]; then
            echo "⚠️  RENDER_API_URL secret not set — skipping database prune."
            echo "   Set it in GitHub repo Settings → Secrets → RENDER_API_URL"
            exit 0
          fi

          if [ -z "$CRON_SECRET" ]; then
            echo "⚠️  CRON_SECRET not set — skipping authenticated prune."
            echo "   Set it in GitHub repo Settings → Secrets → CRON_SECRET"
            exit 0
          fi

          echo "🧹 Triggering database prune at $API_URL/api/v1/cron/prune ..."
          HTTP_RESPONSE=$(curl -sf -X POST \
            --retry 3 \
            --retry-delay 5 \
            --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -w "\n%{http_code}" \
            -o /tmp/prune_response.json \
            "$API_URL/api/v1/cron/prune" \
            || echo "000")

          HTTP_CODE=$(tail -n1 <<< "$HTTP_RESPONSE")

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Database footprint prune executed successfully (HTTP 200)"
            cat /tmp/prune_response.json
          elif [ "$HTTP_CODE" = "000" ]; then
            echo "⚠️  Curl execution failed — service may be deploying or restarting."
            exit 0
          else
            echo "⚠️  Unexpected HTTP response: $HTTP_CODE"
            cat /tmp/prune_response.json || true
            exit 1
          fi
