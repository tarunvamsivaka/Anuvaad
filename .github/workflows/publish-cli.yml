name: Publish @anuvaad/cli to npm

on:
  push:
    tags:
      - 'cli-v*'          # Trigger on tags like cli-v1.0.1
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (publish --dry-run, no actual publish)'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

jobs:
  publish:
    name: Build & Publish CLI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write    # Required for npm provenance attestation

    defaults:
      run:
        working-directory: cli

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: cli/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Verify dist/index.js is executable
        run: |
          node dist/index.js help
          echo "✓ CLI help output verified"

      - name: Publish to npm (dry run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: npm publish --dry-run --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
