# =============================================================================
# render.yaml — Anuvaad Infrastructure-as-Code Blueprint for Render.com
# =============================================================================
# This file defines the complete Render deployment for Anuvaad.
# Changes here are automatically picked up when you connect this repo in Render.
#
# Documentation: https://render.com/docs/blueprint-spec
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Backend API — FastAPI + Uvicorn
  # ---------------------------------------------------------------------------
  - type: web
    name: anuvaad-api
    runtime: python
    plan: starter
    region: oregon
    branch: master
    buildCommand: pip install -r requirements.txt
    # Run Alembic migrations before each deployment starts accepting traffic.
    # This guarantees schema consistency across all deployment stages and prevents
    # startup failures when new columns/tables are required by the app version.
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 4

    healthCheckPath: /api/health

    envVars:
      # ── Runtime environment ──────────────────────────────────────────────
      - key: ENV
        value: production

      # ── REQUIRED: Set all values below in Render Dashboard → Environment ─
      # ── AI Models ────────────────────────────────────────────────────────
      - key: GROQ_API_KEY
        sync: false          # Must be set manually in the Render Dashboard

      - key: DEEPSEEK_API_KEY
        sync: false

      # ── Supabase ─────────────────────────────────────────────────────────
      # Get from: Supabase Dashboard → Settings → API
      - key: SUPABASE_URL
        sync: false

      - key: SUPABASE_ANON_KEY
        sync: false

      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # CRITICAL: This fixes "Server misconfiguration: JWT secret not configured"
      # Get from: Supabase Dashboard → Settings → API → JWT Settings → "JWT Secret"
      # This is required for ANY authenticated request to work.
      - key: SUPABASE_JWT_SECRET
        sync: false

      # ── Database ─────────────────────────────────────────────────────────
      # Get from: Supabase Dashboard → Settings → Database → Connection string (URI)
      - key: DATABASE_URL
        sync: false

      # Optional but recommended for production: PgBouncer connection pooler
      # Get from: Supabase Dashboard → Settings → Database → Connection pooling → URI
      - key: DATABASE_POOL_URL
        sync: false

      # ── Security ─────────────────────────────────────────────────────────
      # Generate with: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: false
        sync: false

      # ── Networking ───────────────────────────────────────────────────────
      # Set to your Vercel frontend URL: https://getanuvaad.vercel.app
      - key: FRONTEND_URL
        sync: false

      # ── GitHub OAuth (for GitHub integration features) ────────────────────
      - key: GITHUB_CLIENT_ID
        sync: false

      - key: GITHUB_CLIENT_SECRET
        sync: false

      # ── Optional: LLM Fallback ────────────────────────────────────────────
      - key: OPENROUTER_API_KEY
        sync: false

      # ── Optional: Error Monitoring ────────────────────────────────────────
      - key: SENTRY_DSN
        sync: false

      # ── Optional: Email ───────────────────────────────────────────────────
      - key: RESEND_API_KEY
        sync: false

      # ── Optional: Redis ───────────────────────────────────────────────────
      # Leave blank if not using Redis; the app falls back to in-memory cache.
      - key: REDIS_URL
        sync: false

      # ── Proxy Trust ───────────────────────────────────────────────────
      # Render's edge proxy always sits in front of the container.
      # TRUST_PROXY_HOPS=1 tells get_client_ip() to read the originating
      # client IP from X-Forwarded-For (last 1 hop) instead of the socket
      # IP (which is Render's proxy, causing all users to share one IP).
      # Required for per-IP rate limiting and anonymous demo quotas to work.
      - key: TRUST_PROXY_HOPS
        value: "1"

      # ── Operational Controls & Metrics ────────────────────────────────
      - key: METRICS_USERNAME
        sync: false

      - key: METRICS_PASSWORD
        sync: false

      - key: LIMIT_FREE_DAILY
        value: "25"

      - key: LIMIT_FREE_CHARS
        value: "10000"

      - key: LIMIT_FREE_COOLDOWN
        value: "5"

      - key: LIMIT_PRO_DAILY
        value: "-1"

      - key: LIMIT_PRO_CHARS
        value: "50000"

      - key: DEMO_RATE_LIMIT_PER_DAY
        value: "3"

      - key: RATE_LIMIT_IP_MAX
        value: "50"

      - key: RATE_LIMIT_USER_MAX
        value: "200"

      - key: PLATFORM_DAILY_CAP_TRANSLATIONS
        value: "1000"

      - key: PROTECTION_MODE
        value: "NORMAL"

      - key: EMERGENCY_MODE_FLAG
        value: "false"

      - key: TOKEN_ENCRYPTION_KEYS
        sync: false

      # ── Guest Tier Limits ──────────────────────────────────────────────────
      # Guest = unauthenticated user. 5/day is the product default (PROJECT.md).
      - key: LIMIT_GUEST_DAILY
        value: "5"

      - key: LIMIT_GUEST_CHARS
        value: "4000"

      - key: LIMIT_GUEST_COOLDOWN
        value: "5"

      # ── Translation History Limits ─────────────────────────────────────────
      - key: HISTORY_LIMIT_PRO
        value: "1000"

      - key: HISTORY_LIMIT_FREE
        value: "100"

      # ── Database Connection Pool Tuning ────────────────────────────────────
      # Note: When DATABASE_POOL_URL is set (PgBouncer), these are overridden
      # and pool_size is forced to 1 (PgBouncer manages the actual pool).
      - key: DB_POOL_SIZE
        value: "5"

      - key: DB_MAX_OVERFLOW
        value: "10"

      - key: DB_POOL_TIMEOUT
        value: "30"

      - key: DB_POOL_RECYCLE
        value: "300"

      # ── Cache & Storage Settings ───────────────────────────────────────────
      - key: CACHE_LRU_MAX_SIZE
        value: "100"

      - key: PROMPT_VERSION
        value: "v1"

      # ── CORS (leave blank unless you have additional frontend origins) ─────
      - key: CORS_ORIGINS
        value: ""

      # ── Groq API Limits (tune to match your Groq plan tier) ───────────────
      - key: GROQ_MAX_RPM
        value: "6000"

      - key: GROQ_MAX_TPM
        value: "100000"

      # ── Worker concurrency (set to 2*CPU+1 for IO-bound workloads) ─────────
      - key: WEB_CONCURRENCY
        value: "2"
