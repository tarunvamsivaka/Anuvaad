[pytest]
testpaths = tests
norecursedirs = node_modules .venv frontend vscode-extension
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    # B-08: Starlette TestClient / httpx2 deprecation — upstream library issue.
    # httpx2 cannot be installed alongside httpx (httpcore conflict at runtime).
    ignore:.*Using `httpx` with `starlette.testclient` is deprecated.*:DeprecationWarning
    ignore:.*StarletteDeprecationWarning.*
    # B-10: razorpay uses pkg_resources (deprecated). Fires during import from importlib.
    ignore:pkg_resources is deprecated:UserWarning
